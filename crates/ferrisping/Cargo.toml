[package]
name = "ferrisping"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Watch latency, packet loss, outages and route changes for several hosts at once"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = "0.37.0"
egui_plot = "0.38.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
jiff = "0.2.38"
ferrisping-core = { version = "0.1.0", path = "../ferrisping-core" }
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu"] }
resvg = { version = "0.49.0", default-features = false }

[build-dependencies]
winresource = "0.1.34"
