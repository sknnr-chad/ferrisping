[package]
name = "ferrisping"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "Watch latency, packet loss, outages and route changes for several hosts at once"
license = "MIT"
publish = false

[dependencies]
# eframe without "default_fonts": FerrisPing draws with Windows' own fonts (see theme.rs),
# and two of egui's bundled fonts have licenses that aren't OSI-approved, which code signing
# from SignPath Foundation doesn't allow.
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "links",
    "persistence",
    "system_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
egui_extras = "0.37.0"
egui_plot = "0.38.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
jiff = "0.2.38"
ferrisping-core = { version = "0.3.0", path = "../ferrisping-core" }
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu"] }
resvg = { version = "0.49.0", default-features = false }

[build-dependencies]
winresource = "0.1.34"
